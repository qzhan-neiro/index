<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书签导航</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #1e2937;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        
        .search-box {
            max-width: 500px;
            margin: 30px auto;
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: none;
            border-radius: 9999px;
            font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .bookmark-card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        
        .bookmark-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(99 102 241 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            border-color: var(--primary);
        }
        
        .bookmark-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #1e2937;
        }
        
        .bookmark-url {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 20px;
            word-break: break-all;
            flex-grow: 1;
        }
        
        .visit-btn {
            margin-top: auto;
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        
        .visit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgb(99 102 241 / 0.3);
        }
        
        .add-form {
            background: white;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
            display: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 60px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 我的书签导航</h1>
            <p style="color: #64748b; margin-top: 8px;">快速访问常用网站</p>
        </header>

        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索书签..." onkeyup="filterBookmarks()">
        </div>

        <!-- 添加新书签 -->
        <div class="add-form" id="addForm">
            <h3>➕ 添加新书签</h3>
            <input type="text" id="newName" placeholder="网站名称" style="margin-bottom:10px;width:100%;padding:12px;border-radius:12px;border:1px solid #e2e8f0;">
            <input type="text" id="newUrl" placeholder="网址 (https://...)" style="margin-bottom:15px;width:100%;padding:12px;border-radius:12px;border:1px solid #e2e8f0;">
            <button onclick="addBookmark()" style="background:#6366f1;color:white;border:none;padding:12px 24px;border-radius:9999px;cursor:pointer;">添加</button>
        </div>

        <div class="grid" id="bookmarksGrid">
            <!-- 书签会通过JS动态添加 -->
        </div>

        <div class="footer">
            点击卡片即可访问 • 支持搜索 • 数据保存在浏览器本地
        </div>
    </div>

    <script>
        let bookmarks = [
            {name: "每日中美行业指数", url: "https://qzhan-neiro.github.io/index/select_index_nav.html"},
            {name: "每日指数图片配置", url: "https://qzhan-neiro.github.io/index/daily-briefing.html"},
            {name: "图片配置", url: "https://qzhan-neiro.github.io/index/slide.html"},
            {name: "微信公众号编辑", url: "https://qzhan-neiro.github.io/index/wechat.html"},
            {name: "任务栏", url: "https://qzhan-neiro.github.io/index/plan.html"},
            {name: "封面图生成", url: "https://qzhan-neiro.github.io/index/pic_c.html"},
            {name: "图片操作", url: "https://qzhan-neiro.github.io/index/pic.html"},
            {name: "中国ETF", url: "https://qzhan-neiro.github.io/index/etf.html"},
            {name: "美国股票", url: "https://qzhan-neiro.github.io/index/etf.html"},



        ];

        function renderBookmarks(filteredBookmarks) {
            const grid = document.getElementById('bookmarksGrid');
            grid.innerHTML = '';
            
            filteredBookmarks.forEach(bookmark => {
                const card = document.createElement('div');
                card.className = 'bookmark-card';
                card.innerHTML = `
                    <div class="bookmark-name">${bookmark.name}</div>
                    <a href="${bookmark.url}" target="_blank" class="visit-btn">立即访问 →</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterBookmarks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = bookmarks.filter(b => 
                b.name.toLowerCase().includes(query) || 
                b.url.toLowerCase().includes(query)
            );
            renderBookmarks(filtered);
        }

        function addBookmark() {
            const name = document.getElementById('newName').value.trim();
            const url = document.getElementById('newUrl').value.trim();
            
            if (name && url) {
                bookmarks.unshift({name, url});
                renderBookmarks(bookmarks);
                document.getElementById('newName').value = '';
                document.getElementById('newUrl').value = '';
                alert('✅ 添加成功！');
            } else {
                alert('请填写名称和网址');
            }
        }

        // 初始化
        window.onload = () => {
            renderBookmarks(bookmarks);
        };
    </script>
</body>
</html>
