<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中美行业指数导航</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.18);
    --text: #e8e8f0;
    --muted: #6b6b80;
    --accent-cn: #ff4d6d;
    --accent-us: #3d9aff;
    --accent-compare: #00e5a0;
    --accent-stocks: #f5a623;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0;
  }

  /* grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }

  header { margin-bottom: 48px; }
  .header-top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .version {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 3px;
  }
  .subtitle { font-size: 13px; color: var(--muted); font-weight: 300; }

  /* tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 32px; border-bottom: 1px solid var(--border); }
  .tab {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    padding: 10px 20px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s, border-color 0.2s;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.3px;
  }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .tab.cn { --c: var(--accent-cn); }
  .tab.us { --c: var(--accent-us); }
  .tab.compare { --c: var(--accent-compare); }
  .tab.stocks { --c: var(--accent-stocks); }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--c); border-bottom-color: var(--c); }
  .tab.active .dot { opacity: 1; }

  /* search */
  .search-bar {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .search-bar:focus-within { border-color: var(--border-hover); }
  .search-bar svg { flex-shrink: 0; opacity: 0.3; }
  .search-bar input {
    background: none; border: none; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 13px;
    flex: 1;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .count { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* panel */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

  /* card */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: block;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0.6;
    transition: opacity 0.15s;
  }
  .card:hover { border-color: var(--border-hover); background: var(--bg3); transform: translateY(-1px); }
  .card:hover::before { opacity: 1; }
  .card.cn { --accent: var(--accent-cn); }
  .card.us { --accent: var(--accent-us); }
  .card.compare { --accent: var(--accent-compare); }
  .card.stocks { --accent: var(--accent-stocks); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-code {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .card-tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid var(--accent);
    color: var(--accent);
    opacity: 0.7;
    letter-spacing: 0.3px;
  }
  .card-name { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 5px; line-height: 1.4; }
  .card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .card-issuer { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tv-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    display: flex; align-items: center; gap: 4px;
    opacity: 0.6;
    transition: opacity 0.15s;
    text-decoration: none;
  }
  .card:hover .tv-link { opacity: 1; }
  .tv-link svg { width: 10px; height: 10px; }

  /* compare table */
  .compare-grid { display: grid; gap: 10px; }
  .compare-row {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 120px 1fr 1fr;
    gap: 16px;
    align-items: center;
    transition: border-color 0.15s;
  }
  .compare-row:hover { border-color: var(--border-hover); }
  .compare-sector { font-size: 13px; font-weight: 500; color: var(--text); }
  .compare-item { display: flex; flex-direction: column; gap: 3px; }
  .compare-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
  .compare-code-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ccode {
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 3px;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .ccode:hover { opacity: 0.75; }
  .ccode.cn { background: rgba(255,77,109,0.12); color: var(--accent-cn); }
  .ccode.us { background: rgba(61,154,255,0.12); color: var(--accent-us); }

  /* hidden */
  .hidden { display: none !important; }

  /* stock section label */
  .stocks-section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.8px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* stock card extras */
  .card-meta { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .card-sector {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .star-rating { color: var(--accent-stocks); font-size: 11px; letter-spacing: 1px; }

  /* empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-family: var(--mono); font-size: 13px; }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .compare-row { grid-template-columns: 1fr; }
    .tab { padding: 10px 12px; font-size: 11px; }
  }
</style>
</head>

function renderCompare() {
  const grid = document.getElementById('compare-grid');
  if (!grid || !DATA.compare) return;
  grid.innerHTML = DATA.compare.map(d => `
    <div class="compare-row">
      <div class="compare-sector">${d.sector}</div>
      <div class="compare-item">
        <span class="compare-label">🇨🇳 中国</span>
        <div class="compare-code-wrap">
          ${d.cn.map(c => {
            const tv = DATA.cn.find(x => x.code === c.code);
            const url = tv ? tvUrl(tv.tv) : '#';
            return `<a class="ccode cn" href="${url}" target="_blank" rel="noopener">${c.label}</a>`;
          }).join('')}
        </div>
      </div>
      <div class="compare-item">
        <span class="compare-label">🇺🇸 美国</span>
        <div class="compare-code-wrap">
          ${d.us.map(c => {
            const tv = DATA.us.find(x => x.code === c.code);
            const url = tv ? tvUrl(tv.tv) : '#';
            return `<a class="ccode us" href="${url}" target="_blank" rel="noopener">${c.label}</a>`;
          }).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function updateCount(market) {
  const grid = document.getElementById(market + '-grid');
  const visible = grid.querySelectorAll('.card:not(.hidden)').length;
  const total = DATA[market].length;
  document.getElementById(market + '-count').textContent = visible === total ? `${total} 个` : `${visible} / ${total}`;
}

function filterCards(gridId, query) {
  const market = gridId.replace('-grid', '');
  const q = query.toLowerCase().trim();
  const grid = document.getElementById(gridId);
  const cards = grid.querySelectorAll('.card');
  cards.forEach(card => {
    const match = !q || card.dataset.search.toLowerCase().includes(q);
    card.classList.toggle('hidden', !match);
  });
  const visible = grid.querySelectorAll('.card:not(.hidden)').length;
  document.getElementById(market + '-empty').classList.toggle('hidden', visible > 0);
  updateCount(market);
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab.${id}`).classList.add('active');
  document.getElementById(id).classList.add('active');
}
