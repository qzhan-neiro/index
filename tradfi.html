let currentCategory = 'ALL';

function renderTable(items) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${index + 1}</td>
            <td class="symbol-code">${item.s}</td>
            <td class="name-cn">${item.n}</td>
            <td><span class="category-tag">${item.c}</span></td>
            <td class="desc">${item.d}</td>
        `;
        tbody.appendChild(row);
    });
    
    document.getElementById('statsCount').innerText = `显示 ${items.length} / ${data.length} 个项目`;
}

function selectCategory(cat) {
    currentCategory = cat;
    
    // 更新按钮高亮样式
    const btns = document.querySelectorAll('.cat-btn');
    btns.forEach(btn => {
        if ((cat === 'ALL' && btn.innerText.includes('全部')) || btn.innerText.includes(cat.replace('与', '').slice(0,4))) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    
    filterTable();
}

function filterTable() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    
    const filtered = data.filter(item => {
        const matchesCategory = (currentCategory === 'ALL' || item.c === currentCategory);
        const matchesQuery = !query || 
            item.s.toLowerCase().includes(query) ||
            item.n.toLowerCase().includes(query) ||
            item.c.toLowerCase().includes(query) ||
            item.d.toLowerCase().includes(query);
            
        return matchesCategory && matchesQuery;
    });
    
    renderTable(filtered);
}

// 初始渲染全部
renderTable(data);
